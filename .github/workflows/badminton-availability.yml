name: Badminton Availability Scrape

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days ahead to scrape"
        required: false
        default: "7"
  schedule:
    - cron: "15 6 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: |
          DAYS_INPUT="${{ github.event.inputs.days }}"
          DAYS="${DAYS_INPUT:-7}"
          python scripts/scrape_badminton_availability.py --days "$DAYS"

      - name: Upload availability artifacts
        uses: actions/upload-artifact@v4
        with:
          name: badminton-availability
          path: output/availability.*
          if-no-files-found: error
